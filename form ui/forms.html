<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="forms.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="form">
      <h1>Sign in</h1>
      <form action="">
        <div>
          <input
            id="username"
            type="text"
            placeholder="Email"
            name="username"
          />
        </div>
        <div>
          <input
            id="password"
            type="password"
            placeholder="password"
            name="password"
          />
        </div>
        <div class="forgot"><a href="">Forgot Password?</a></div>
        <button>Login</button>
        <div class="account">
          Don't have an account? <span>Sign up here</span>
        </div>
      </form>
    </div>
  </body>
</html>
